<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bihar Assembly Election Candidates 2025</title>

  <style>
    body { font-family: Arial, sans-serif; margin: 2em; background: #f9fafb; }
    select, table { margin-top: 1em; }
    select { padding: 0.5em; font-size: 1em; }
    table { border-collapse: collapse; width: 95%; background: white; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f1f1f1; }
    .filters { display: flex; gap: 1em; align-items: center; flex-wrap: wrap; }
  </style>
</head>

<body>
  <h2>Bihar Election Data Viewer 2025</h2>

  <div class="filters">
    <div>
      <label for="partyDropdown">Select Party:</label><br>
      <select id="partyDropdown">
        <option value="">-- Select a Party --</option>
        <option value="bjp">BJP</option>
        <option value="inc">INC</option>
        <option value="jdu">JDU</option>
        <option value="ljp">LOJPA</option>
        <option value="cpi(ml)">CPI(ML)</option>
        <option value="rjd">RJD</option>
        <option value="ham(s)">HAM(S)</option>
        <option value="cpi(m)">CPI(M)</option>
        <option value="aimim">AIMIM</option>
        <option value="rlm">RLM</option>
        <option value="iip">IIP</option>
        <option value="bsp">BSP</option>
      </select>
    </div>

    <div>
      <label for="constDropdown">Select Constituency:</label><br>
      <select id="constDropdown">
        <option value="">-- Select Constituency --</option>
      </select>
    </div>
  </div>

  <div id="result"></div>

  <script>
    const partyDropdown = document.getElementById("partyDropdown");
    const constDropdown = document.getElementById("constDropdown");
    const result = document.getElementById("result");

    const parties = ['bjp', 'inc', 'jdu', 'ljp', 'cpi(ml)', 'rjd', 'ham(s)', 'cpi(m)', 'aimim', 'rlm', 'iip', 'bsp'];
    const allData = {};

    // Load all party JSON files
    Promise.all(
      parties.map(p =>
        fetch(`data/${p}.json`)
          .then(res => res.ok ? res.json() : [])
          .then(data => { allData[p] = data.map(c => ({ ...c, party: p })); })
      )
    ).then(() => populateConstituencies());

    // Populate constituency dropdown
    function populateConstituencies() {
      const allCandidates = Object.values(allData).flat();
      const constituencies = [...new Set(allCandidates.map(c => c.constituency.trim()))].sort();

      constituencies.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        constDropdown.appendChild(opt);
      });
    }

    // Party selection
    partyDropdown.addEventListener("change", () => {
      const p = partyDropdown.value;
      if (!p) { result.innerHTML = ""; return; }
      showCandidates(allData[p], `${p.toUpperCase()} Candidates`, p);
      constDropdown.value = "";
    });

    // Constituency selection
    constDropdown.addEventListener("change", () => {
      const c = constDropdown.value;
      if (!c) { result.innerHTML = ""; return; }

      const matches = [];
      Object.values(allData).flat().forEach(candidate => {
        if (candidate.constituency.trim().toLowerCase() === c.toLowerCase()) {
          matches.push(candidate);
        }
      });

      showCandidates(matches, `Candidates in ${c}`, null);
      partyDropdown.value = "";
    });

    // Show table
    function showCandidates(candidates, title, selectedParty) {
      if (!candidates.length) {
        result.innerHTML = `<p style="color:red;">No data found.</p>`;
        return;
      }

      let html = `<h3>${title}</h3>`;
      html += `<table>
        <tr>
          <th>Winning Candidate</th>
          <th>Party</th>
          <th>Constituency</th>
          <th>Total Votes</th>
          <th>Margin</th>
        </tr>`;

      html += candidates.map(c => `
        <tr>
          <td>${c.name || "-"}</td>
          <td>${(c.party || selectedParty || "-").toUpperCase()}</td>
          <td>${c.constituency || "-"}</td>
          <td>${c.votes ?? "-"}</td>
          <td>${c.margin ?? "-"}</td>
        </tr>
      `).join("");

      html += `</table>`;
      result.innerHTML = html;
    }
  </script>

</body>
</html>
